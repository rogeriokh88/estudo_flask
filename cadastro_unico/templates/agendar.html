{% extends 'base.html' %}
{% block links %} 
<link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
<link rel="stylesheet" href="{{url_for('static',filename='css/agendar.css')}}">
{% endblock %}

{% block content%}
{% include 'nav.html' %}
<div>
<div class="form-container">
        <div>
        <h2>Agendamento de Serviço</h2>
        <p>Preencha os dados abaixo para realizar o seu agendamento.</p>
        </div>

        <form action="#" method="POST">
            
            <!-- Nome Completo -->
            <div class="input-group">
                <label for="nome_completo">Nome Completo</label>
                <input type="text" id="nome_completo" name="nome_completo" placeholder="Digite seu nome completo" required>
            </div>

            <!-- CPF e NIS lado a lado em telas maiores -->
            <div class="input-row">
                <div class="input-group">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required>
                </div>

                <div class="input-group">
                    <label for="nis">NIS</label>
                    <input type="text" id="nis" name="nis" placeholder="000.00000.00-0" required>
                </div>
            </div>

            <!-- Telefone -->
            <div class="input-group">
                <label for="telefone">Telefone / WhatsApp</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
            </div>

            <!-- Data e Horário -->
            <div class="input-row">
                <div class="input-group">
                    <label for="data_agendamento">Data do Agendamento</label>
                    <input type="date" id="data_agendamento" name="data_agendamento" required>
                </div>

                <div class="input-group">
                    <label for="horario">Horário</label>
                    <input type="time" id="horario" name="horario" required>
                </div>
            </div>

            <!-- Seleção de Serviço -->
            <div class="input-group">
                <label for="servico">Selecione o Serviço</label>
                <select id="servico" name="servico" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="atualizar">Atualizar</option>
                    <option value="consultar">Consultar</option>
                    <option value="cadastrar">Cadastrar</option>
                    <option value="folha_resumo">Folha Resumo</option>
                </select>
            </div>

            <!-- Botão de Envio -->
            <button type="submit" class="btn-submit">Confirmar Agendamento</button>

        </form>
    </div>
  
</div>
{% endblock %}
